{% extends 'base.html' %}
{% block content %}
<h1>Apply to {{ template_data.job.title }}</h1>
<p class="text-muted">{{ template_data.job.company }} · {{ template_data.job.city }}</p>

<div style="max-width: 600px">
    <div class="mb-3">
        <label class="form-label" for="resume">Résumé</label>
        <input class="form-control" type="file" id="resume" name="resume">
    </div>
    <div class="mb-3">
        <label class="form-label" for="note">Note (optional)</label>
        <textarea class="form-control" id="note" name="note" rows="4"></textarea>
    </div>
    <button class="btn btn-primary" type="button">Send application</button>
    <button class="btn btn-outline-dark" type="button">Cancel</button>
</div>
{% endblock content %}
