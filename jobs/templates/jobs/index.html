{% extends 'base.html' %}
{% block content %}
<h1>Jobs</h1>

<div class="d-flex gap-2 my-3">
    <input class="form-control" type="search" name="q" placeholder="Title, company or keyword">
    <input class="form-control" type="text" name="location" placeholder="Location">
    <button class="btn btn-primary" type="button">Search</button>
</div>

{% for job in template_data.jobs %}
<div class="card mb-3">
    <div class="card-body d-flex flex-wrap align-items-center gap-3">
        <div class="flex-grow-1">
            <h5 class="card-title mb-1">
                <a href="{% url 'jobs.show' id=job.id %}">{{ job.title }}</a>
            </h5>
            <p class="card-text text-muted mb-0">{{ job.company }} · {{ job.city }} · {{ job.salary_min }}K-{{ job.salary_max }}K</p>
        </div>
        <button class="btn btn-primary" type="button">Apply</button>
        <button class="btn btn-outline-dark" type="button">Add to cart</button>
    </div>
</div>
{% endfor %}
{% endblock content %}
