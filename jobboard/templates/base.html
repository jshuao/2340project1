<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ template_data.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
        <div class="container flex-wrap">
            <a class="navbar-brand fw-bold" href="{% url 'home.index' %}">JobBoard</a>
            <div class="navbar-nav flex-wrap">
                <a class="nav-link" href="{% url 'jobs.index' %}">Jobs</a>
                <a class="nav-link" href="{% url 'jobs.map' %}">Map</a>
                <a class="nav-link" href="{% url 'cart.index' %}">Cart</a>
                <a class="nav-link" href="{% url 'accounts.profile' %}">Profile</a>
                <a class="nav-link" href="{% url 'recruiters.dashboard' %}">Recruiters</a>
                <a class="nav-link" href="{% url 'accounts.login' %}">Log in</a>
                <a class="nav-link" href="{% url 'accounts.signup' %}">Sign up</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock content %}
    </main>
</body>
</html>
