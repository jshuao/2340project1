{% extends 'base.html' %}
{% block content %}
<h1>Candidates</h1>

<div class="d-flex gap-2 my-3">
    <input class="form-control" type="search" name="q" placeholder="Skills, title or keyword">
    <button class="btn btn-primary" type="button">Search</button>
</div>

<div class="row">
    {% for candidate in template_data.candidates %}
    <div class="col-6 col-md-3 mb-3">
        <div class="card h-100">
            <div class="card-body">
                <h6 class="card-title">{{ candidate }}</h6>
                <p class="card-text text-muted small">Backend · 4 yrs</p>
                <button class="btn btn-sm btn-outline-dark" type="button">View</button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock content %}
