{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h1>Dashboard</h1>
    <button class="btn btn-primary" type="button">Post a job</button>
</div>

<div class="row text-center my-4">
    <div class="col"><h2>6</h2><p class="text-muted">Active</p></div>
    <div class="col"><h2>23</h2><p class="text-muted">New applicants</p></div>
    <div class="col"><h2>11</h2><p class="text-muted">In review</p></div>
    <div class="col"><h2>4</h2><p class="text-muted">Interviews</p></div>
</div>

<h5>My postings</h5>
<ul class="list-group mb-3">
    {% for job in template_data.jobs %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ job.title }}
        <button class="btn btn-sm btn-outline-dark" type="button">Review applicants</button>
    </li>
    {% endfor %}
</ul>

<a href="{% url 'recruiters.candidates' %}">Search candidates</a>
{% endblock content %}
