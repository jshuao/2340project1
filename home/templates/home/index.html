{% extends 'base.html' %}
{% block content %}
<div class="py-5">
    <h1 class="display-4 fw-bold">Find the work</h1>
    <p class="lead">Search jobs, save the ones you like, and apply with one resume.</p>

    <div class="d-flex gap-2 my-4">
        <input class="form-control" type="search" name="q" placeholder="Title or skill">
        <input class="form-control" type="text" name="location" placeholder="Location">
        <button class="btn btn-primary" type="button">Search</button>
    </div>

    <button class="btn btn-primary" type="button">I'm a job seeker</button>
    <button class="btn btn-outline-dark" type="button">I'm a recruiter</button>
</div>
{% endblock content %}
